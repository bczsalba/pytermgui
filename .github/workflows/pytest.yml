name: Run tests

on:
  workflow_dispatch:
  push:
    paths:
      - "pytermgui/**"
      - "tests/**"
      - ".github/workflows/pytest.yml"
      - "pyproject.toml"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install .

          pip install testfixtures
          pip install pytest-cov
          pip install coverage
          pip install pyyaml

      - name: Run tests with coverage
        run: pytest --cov=pytermgui
